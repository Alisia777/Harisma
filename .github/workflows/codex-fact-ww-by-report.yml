name: Temporary encrypted FACT WW export by report

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: codex-fact-ww-by-report
  cancel-in-progress: true

jobs:
  export:
    if: github.event.issue.title == '[codex] FACT WW by report 2026-07-29'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WB_FINANCE_TOKEN: ${{ secrets.ALTEA_WB_PROMOTION_TOKEN }}
      DATE_FROM: '2026-07-25'
      DATE_TO: '2026-07-29'
      OUTPUT_JSON: /tmp/fact_ww_by_report.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark start
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'by-report-export-started'

      - uses: actions/checkout@v4
        with:
          ref: codex/fact-ww-export-20260729
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch list and latest daily reports
        id: fetch
        shell: bash
        run: |
          set +e
          python scripts/codex-fact-ww-by-report.py > /tmp/by-report.log 2>&1
          STATUS=$?
          cat /tmp/by-report.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment failure
        if: steps.fetch.outputs.status != '0'
        shell: bash
        run: |
          { echo 'by-report-export-failed'; echo '```text'; tail -c 7000 /tmp/by-report.log; echo; echo '```'; } > /tmp/failure.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/failure.txt

      - name: Stop after failure
        if: steps.fetch.outputs.status != '0'
        run: exit 1

      - name: Encrypt result
        shell: bash
        run: |
          openssl rand -hex 32 > /tmp/pass.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$OUTPUT_JSON" -out /tmp/result.enc -pass file:/tmp/pass.txt
          openssl pkeyutl -encrypt -pubin -inkey scripts/codex-fact-ww-public.pem -in /tmp/pass.txt -out /tmp/pass.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          mkdir -p tmp/codex-fact-ww-by-report
          base64 -w0 /tmp/result.enc > tmp/codex-fact-ww-by-report/export.enc.b64
          base64 -w0 /tmp/pass.enc > tmp/codex-fact-ww-by-report/key.enc.b64
          printf 'completed_at=%s\n' "$(date -u +%FT%TZ)" > tmp/codex-fact-ww-by-report/completed.txt

      - name: Commit encrypted result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/codex-fact-ww-by-report
          git commit -m 'Store encrypted FACT WW report export'
          git push origin HEAD:codex/fact-ww-export-20260729

      - name: Mark success
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'by-report-export-completed'
