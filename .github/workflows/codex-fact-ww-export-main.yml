name: Temporary encrypted FACT WW export

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: codex-fact-ww-export-main
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[codex] FACT WW export 2026-07-29')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WB_FINANCE_TOKEN: ${{ secrets.ALTEA_WB_FINANCE_TOKEN || secrets.ALTEA_WB_API_TOKEN }}
      OUTPUT_JSON: /tmp/fact_ww_export.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark workflow start
        if: github.event_name == 'issues'
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'export-started'

      - uses: actions/checkout@v4
        with:
          ref: codex/fact-ww-export-20260729
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch fresh non-zero article substitutions
        id: fetch
        shell: bash
        run: |
          set +e
          node scripts/codex-fact-ww-export.js > /tmp/fetch.log 2>&1
          STATUS=$?
          cat /tmp/fetch.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment export failure
        if: steps.fetch.outputs.status != '0' && github.event_name == 'issues'
        shell: bash
        run: |
          {
            echo 'export-failed'
            echo '```text'
            tail -c 5000 /tmp/fetch.log
            echo
            echo '```'
          } > /tmp/failure-comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/failure-comment.txt

      - name: Stop after export failure
        if: steps.fetch.outputs.status != '0'
        run: exit 1

      - name: Encrypt export for retrieval
        shell: bash
        run: |
          openssl rand -hex 32 > /tmp/fact_ww_passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$OUTPUT_JSON" -out /tmp/fact_ww_export.enc \
            -pass file:/tmp/fact_ww_passphrase.txt
          openssl pkeyutl -encrypt -pubin -inkey scripts/codex-fact-ww-public.pem \
            -in /tmp/fact_ww_passphrase.txt -out /tmp/fact_ww_passphrase.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          mkdir -p tmp/codex-fact-ww-export
          base64 -w0 /tmp/fact_ww_export.enc > tmp/codex-fact-ww-export/export.enc.b64
          base64 -w0 /tmp/fact_ww_passphrase.enc > tmp/codex-fact-ww-export/key.enc.b64
          printf 'completed_at=%s\n' "$(date -u +%FT%TZ)" > tmp/codex-fact-ww-export/completed.txt

      - name: Commit encrypted result to temporary branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/codex-fact-ww-export/export.enc.b64 tmp/codex-fact-ww-export/key.enc.b64 tmp/codex-fact-ww-export/completed.txt
          git commit -m 'Store encrypted one-off FACT WW export'
          git push origin HEAD:codex/fact-ww-export-20260729

      - name: Mark workflow success
        if: github.event_name == 'issues'
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'export-completed'
