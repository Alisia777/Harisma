name: Codex encrypted FACT WW export

on:
  push:
    branches:
      - codex/fact-ww-export-20260729
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-fact-ww-export-20260729
  cancel-in-progress: false

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WB_FINANCE_TOKEN: ${{ secrets.ALTEA_WB_FINANCE_TOKEN || secrets.ALTEA_WB_API_TOKEN }}
      OUTPUT_JSON: /tmp/fact_ww_export.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fact-ww-export-20260729
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch fresh non-zero article substitutions
        run: node scripts/codex-fact-ww-export.js

      - name: Encrypt export for retrieval
        shell: bash
        run: |
          openssl rand -hex 32 > /tmp/fact_ww_passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$OUTPUT_JSON" -out /tmp/fact_ww_export.enc \
            -pass file:/tmp/fact_ww_passphrase.txt
          openssl pkeyutl -encrypt -pubin -inkey scripts/codex-fact-ww-public.pem \
            -in /tmp/fact_ww_passphrase.txt -out /tmp/fact_ww_passphrase.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          mkdir -p tmp/codex-fact-ww-export
          base64 -w0 /tmp/fact_ww_export.enc > tmp/codex-fact-ww-export/export.enc.b64
          base64 -w0 /tmp/fact_ww_passphrase.enc > tmp/codex-fact-ww-export/key.enc.b64
          printf 'completed_at=%s\n' "$(date -u +%FT%TZ)" > tmp/codex-fact-ww-export/completed.txt

      - name: Commit encrypted result to temporary branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/codex-fact-ww-export/export.enc.b64 tmp/codex-fact-ww-export/key.enc.b64 tmp/codex-fact-ww-export/completed.txt
          git commit -m 'Store encrypted one-off FACT WW export'
          git push origin HEAD:codex/fact-ww-export-20260729
