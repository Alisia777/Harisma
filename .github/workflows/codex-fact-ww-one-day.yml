name: Temporary one-day encrypted FACT WW export

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: codex-fact-ww-one-day
  cancel-in-progress: true

jobs:
  export:
    if: github.event.issue.title == '[codex] FACT WW one-day 2026-07-28'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WB_FINANCE_TOKEN: ${{ secrets.ALTEA_WB_PROMOTION_TOKEN }}
      TARGET_DATE: '2026-07-28'
      OUTPUT_JSON: /tmp/fact_ww_one_day.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark start
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'one-day-export-started'
      - uses: actions/checkout@v4
        with:
          ref: codex/fact-ww-export-20260729
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch one daily report
        id: fetch
        shell: bash
        run: |
          set +e
          node scripts/codex-fact-ww-one-day.js > /tmp/one-day.log 2>&1
          STATUS=$?
          cat /tmp/one-day.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment failure
        if: steps.fetch.outputs.status != '0'
        shell: bash
        run: |
          { echo 'one-day-export-failed'; echo '```text'; tail -c 5000 /tmp/one-day.log; echo; echo '```'; } > /tmp/failure.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/failure.txt
      - name: Stop after failure
        if: steps.fetch.outputs.status != '0'
        run: exit 1
      - name: Encrypt result
        shell: bash
        run: |
          openssl rand -hex 32 > /tmp/pass.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$OUTPUT_JSON" -out /tmp/result.enc -pass file:/tmp/pass.txt
          openssl pkeyutl -encrypt -pubin -inkey scripts/codex-fact-ww-public.pem -in /tmp/pass.txt -out /tmp/pass.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          mkdir -p tmp/codex-fact-ww-one-day-2026-07-28
          base64 -w0 /tmp/result.enc > tmp/codex-fact-ww-one-day-2026-07-28/export.enc.b64
          base64 -w0 /tmp/pass.enc > tmp/codex-fact-ww-one-day-2026-07-28/key.enc.b64
          printf 'completed_at=%s\n' "$(date -u +%FT%TZ)" > tmp/codex-fact-ww-one-day-2026-07-28/completed.txt
      - name: Commit encrypted result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/codex-fact-ww-one-day-2026-07-28
          git commit -m 'Store encrypted one-day FACT WW export'
          git push origin HEAD:codex/fact-ww-export-20260729
      - name: Mark success
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'one-day-export-completed'
