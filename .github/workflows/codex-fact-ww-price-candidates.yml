name: Encrypted recent WW price candidate extraction

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-fact-ww-price-candidates-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  extract:
    if: github.event.issue.title == '[codex] FACT WW price candidates 2026-07-29'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WB_STATISTICS_TOKEN: ${{ secrets.ALTEA_WB_STATISTICS_TOKEN || secrets.ALTEA_WB_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RESULT_JSON: /tmp/fact_ww_price_candidates.json
    steps:
      - name: Publish run id
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "price-candidates-started run-id=${{ github.run_id }}"

      - uses: actions/checkout@v4
        with:
          ref: codex/fact-ww-export-20260729

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch July orders and detect 3 percent price shifts
        id: extract
        shell: bash
        run: |
          python <<'PY'
          import json, os, urllib.request, urllib.parse
          from collections import Counter, defaultdict
          from datetime import datetime, timezone, timedelta

          token = os.environ['WB_STATISTICS_TOKEN'].strip()
          if not token:
              raise RuntimeError('Statistics token is empty')

          endpoint = 'https://statistics-api.wildberries.ru/api/v1/supplier/orders'
          params = urllib.parse.urlencode({'dateFrom':'2026-07-01T00:00:00','flag':0})
          req = urllib.request.Request(endpoint + '?' + params, headers={
              'Authorization':token, 'Accept':'application/json', 'User-Agent':'Harisma-FACT-WW-price-candidates/1.0'
          })
          with urllib.request.urlopen(req, timeout=300) as resp:
              rows = json.loads(resp.read().decode() or '[]')
          if not isinstance(rows, list):
              raise RuntimeError(f'Expected list, got {type(rows).__name__}')

          def num(v):
              try: return float(str(v or 0).replace(' ','').replace(',','.'))
              except Exception: return 0.0
          def parse_dt(v):
              s=str(v or '').strip()
              if not s: return None
              try: return datetime.fromisoformat(s.replace('Z','+00:00'))
              except Exception: return None
          def key_price(v): return round(num(v),2)

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=84)
          by_nm = defaultdict(list)
          for row in rows:
              nm = str(row.get('nmId') or '').strip()
              if nm: by_nm[nm].append(row)

          candidates=[]
          group_summaries=[]
          for nm, items in by_nm.items():
              prices=[key_price(x.get('priceWithDisc')) for x in items if key_price(x.get('priceWithDisc'))>0]
              if not prices: continue
              counts=Counter(prices)
              # Baseline: most frequent July seller price; ties prefer the higher price.
              baseline=max(counts.items(), key=lambda kv:(kv[1],kv[0]))[0]
              mode_count=counts[baseline]
              recent=[]
              for row in items:
                  dt=parse_dt(row.get('date')) or parse_dt(row.get('lastChangeDate'))
                  if not dt: continue
                  if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
                  if dt < cutoff: continue
                  price=key_price(row.get('priceWithDisc'))
                  if price<=0 or baseline<=0: continue
                  ratio=price/baseline
                  discount_delta=num(row.get('discountPercent'))
                  price_shift=(1-ratio)*100
                  # Target around the 3% affiliated discount. Keep a broad diagnostic band.
                  if 2.4 <= price_shift <= 3.6:
                      obj={
                          'nmId':row.get('nmId'),'supplierArticle':row.get('supplierArticle'),'brand':row.get('brand'),
                          'subject':row.get('subject'),'date':row.get('date'),'lastChangeDate':row.get('lastChangeDate'),
                          'srid':row.get('srid'),'gNumber':row.get('gNumber'),'barcode':row.get('barcode'),
                          'totalPrice':row.get('totalPrice'),'discountPercent':row.get('discountPercent'),
                          'priceWithDisc':row.get('priceWithDisc'),'finishedPrice':row.get('finishedPrice'),
                          'spp':row.get('spp'),'isCancel':row.get('isCancel'),'cancelDate':row.get('cancelDate'),
                          'baselinePriceWithDisc':baseline,'baselineCount':mode_count,
                          'priceShiftPercent':price_shift,'ratioToBaseline':ratio,
                      }
                      recent.append(obj); candidates.append(obj)
              if recent:
                  group_summaries.append({
                      'nmId':nm,'supplierArticle':next((x.get('supplierArticle') for x in items if x.get('supplierArticle')),''),
                      'brand':next((x.get('brand') for x in items if x.get('brand')),''),
                      'subject':next((x.get('subject') for x in items if x.get('subject')),''),
                      'baselinePriceWithDisc':baseline,'baselineCount':mode_count,
                      'candidateRows':len(recent),'candidatePrices':sorted(set(key_price(x.get('priceWithDisc')) for x in recent)),
                      'latestCandidateAt':max(str(x.get('date') or '') for x in recent),
                      'srids':[str(x.get('srid') or '') for x in recent if x.get('srid')],
                  })

          group_summaries.sort(key=lambda x:(x['latestCandidateAt'], -x['candidateRows']), reverse=True)
          candidates.sort(key=lambda x:str(x.get('date') or ''), reverse=True)

          # Also list the newest order rows regardless of detection for manual inspection.
          newest=[]
          for row in rows:
              dt=parse_dt(row.get('date')) or parse_dt(row.get('lastChangeDate'))
              if not dt: continue
              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              if dt >= cutoff:
                  newest.append({k:row.get(k) for k in [
                      'date','lastChangeDate','nmId','supplierArticle','brand','subject','totalPrice','discountPercent',
                      'priceWithDisc','finishedPrice','spp','isCancel','cancelDate','srid','gNumber','barcode'
                  ]})
          newest.sort(key=lambda x:str(x.get('date') or ''), reverse=True)

          result={
              'generatedAt':now.isoformat(),'cutoff':cutoff.isoformat(),
              'diagnostics':{'ordersFetched':len(rows),'nmIds':len(by_nm),'candidateNmIds':len(group_summaries),'candidateRows':len(candidates),'recentRows':len(newest)},
              'candidateGroups':group_summaries,'candidateRows':candidates,'recentRows':newest
          }
          with open(os.environ['RESULT_JSON'],'w',encoding='utf-8') as f: json.dump(result,f,ensure_ascii=False,indent=2)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"candidate_nmids={len(group_summaries)}\n")
              f.write(f"candidate_rows={len(candidates)}\n")
          print(json.dumps(result['diagnostics'],ensure_ascii=False),flush=True)
          PY

      - name: Encrypt result
        shell: bash
        run: |
          openssl rand -hex 32 > /tmp/pass.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RESULT_JSON" -out /tmp/result.enc -pass file:/tmp/pass.txt
          openssl pkeyutl -encrypt -pubin -inkey scripts/codex-fact-ww-public.pem -in /tmp/pass.txt -out /tmp/pass.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          mkdir -p /tmp/fact-ww-price-candidates
          cp /tmp/result.enc /tmp/fact-ww-price-candidates/result.enc
          cp /tmp/pass.enc /tmp/fact-ww-price-candidates/key.enc

      - uses: actions/upload-artifact@v4
        with:
          name: fact-ww-price-candidates-${{ github.run_id }}
          path: /tmp/fact-ww-price-candidates
          retention-days: 1

      - name: Publish completion
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "price-candidates-completed run-id=${{ github.run_id }} candidate-nmids=${{ steps.extract.outputs.candidate_nmids }} candidate-rows=${{ steps.extract.outputs.candidate_rows }}"
