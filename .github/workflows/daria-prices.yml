name: Daria prices CSV

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

concurrency:
  group: daria-prices-csv
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Daria price table
        run: >-
          node scripts/build-daria-price-table.js
          --output daria-prices.csv
          --summary exports/daria-prices.summary.json
          --multiplier 1.02

      - name: Validate CSV
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const csv = fs.readFileSync('daria-prices.csv', 'utf8').trim().split(/\r?\n/);
          const header = csv[0].split(',');
          const rows = csv.slice(1).map((line) => line.split(','));
          const badRows = rows
            .map((cols, index) => ({ line: index + 2, cols: cols.length }))
            .filter((row) => row.cols !== 8);
          if (header.length !== 8 || header[0] !== 'SKU' || !rows.length || badRows.length) {
            console.error(JSON.stringify({ header, rows: rows.length, badRows }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ rows: rows.length }, null, 2));
          NODE

      - name: Commit CSV changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daria-prices.csv exports/daria-prices.summary.json
          if git diff --cached --quiet; then
            echo "Daria prices CSV is unchanged."
            exit 0
          fi
          git commit -m "Update Daria prices CSV"
          git push
