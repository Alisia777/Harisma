name: Daria prices CSV

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

concurrency:
  group: daria-prices-csv
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Daria price table
        run: >-
          node scripts/build-daria-price-table.js
          --output daria-prices.csv
          --tsv-output daria-prices-google.tsv
          --summary exports/daria-prices.summary.json
          --multiplier 1.02

      - name: Publish cache-safe CSV copy
        run: cp daria-prices.csv daria-prices-clean.csv

      - name: Validate CSV
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            { path: 'daria-prices.csv', delimiter: ',' },
            { path: 'daria-prices-clean.csv', delimiter: ',' },
            { path: 'daria-prices-google.tsv', delimiter: '\t' }
          ];
          for (const file of files) {
            const lines = fs.readFileSync(file.path, 'utf8').trim().split(/\r?\n/);
            const header = lines[0].split(file.delimiter);
            const rows = lines.slice(1).map((line) => line.split(file.delimiter));
            const badRows = rows
              .map((cols, index) => ({ line: index + 2, cols: cols.length }))
              .filter((row) => row.cols !== 8);
            const negativeCells = [];
            rows.forEach((cols, rowIndex) => {
              cols.slice(1).forEach((cell, offset) => {
                const value = Number(cell);
                if (Number.isFinite(value) && value < 0) {
                  negativeCells.push({ line: rowIndex + 2, column: header[offset + 1], value });
                }
              });
            });
            if (header.length !== 8 || header[0] !== 'SKU' || !rows.length || badRows.length || negativeCells.length) {
              console.error(JSON.stringify({ file: file.path, header, rows: rows.length, badRows, negativeCells }, null, 2));
              process.exit(1);
            }
            console.log(JSON.stringify({ file: file.path, rows: rows.length, negativeCells: 0 }, null, 2));
          }
          NODE

      - name: Commit CSV changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daria-prices.csv daria-prices-clean.csv daria-prices-google.tsv exports/daria-prices.summary.json
          if git diff --cached --quiet; then
            echo "Daria prices CSV is unchanged."
            exit 0
          fi
          git commit -m "Update Daria prices CSV"
          git push
