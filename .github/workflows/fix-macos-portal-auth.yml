name: One-shot macOS portal auth hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-macos-portal-auth.yml

permissions:
  contents: write

concurrency:
  group: fix-macos-portal-auth
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto the latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch canonical HTTPS handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          gate_path = Path('portal-auth-gate.js')
          index = index_path.read_text(encoding='utf-8')
          gate = gate_path.read_text(encoding='utf-8')

          redirect_marker = 'window.__ALTEA_CANONICAL_HTTPS_REDIRECT__'
          if redirect_marker not in index:
              marker = '  <meta http-equiv="Expires" content="0">\n'
              if marker not in index:
                  raise SystemExit('index redirect insertion marker was not found')
              redirect = '''  <script id="altea-canonical-https-redirect">\n    (function () {\n      var protocol = String(window.location.protocol || '').toLowerCase();\n      var hostname = String(window.location.hostname || '').toLowerCase();\n      var local = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]' || hostname === '::1';\n      window.__ALTEA_CANONICAL_HTTPS_REDIRECT__ = true;\n      if (protocol === 'http:' && !local) {\n        window.location.replace('https://' + window.location.host + window.location.pathname + window.location.search + window.location.hash);\n      }\n    }());\n  </script>\n'''
              index = index.replace(marker, marker + redirect, 1)

          index = index.replace(
              "window.__ALTEA_PORTAL_BUILD__ = '20260717taskvisibility1';",
              "window.__ALTEA_PORTAL_BUILD__ = '20260720macoshttps1';",
              1,
          )
          index = index.replace(
              'portal-auth-gate.js?v=20260720auth-timeout1',
              'portal-auth-gate.js?v=20260720macoshttps1',
              1,
          )

          old_transport = '''  function hasStrongTransport() {\n    var protocol = String(window.location.protocol || '').toLowerCase();\n    return protocol === 'https:' || protocol === 'file:' || isLocalHost();\n  }\n'''
          new_transport = '''  function hasStrongTransport() {\n    var protocol = String(window.location.protocol || '').toLowerCase();\n    if (protocol === 'https:' || protocol === 'file:' || isLocalHost()) return true;\n    return window.isSecureContext === true;\n  }\n\n  function secureCanonicalUrl() {\n    var location = window.location || {};\n    var host = String(location.host || '').replace(/^\\s+|\\s+$/g, '');\n    if (!host) return '';\n    return 'https://' + host + String(location.pathname || '/') + String(location.search || '') + String(location.hash || '');\n  }\n\n  function redirectToStrongTransport() {\n    var protocol = String(window.location.protocol || '').toLowerCase();\n    var target;\n    if (hasStrongTransport()) return false;\n    if (protocol !== 'http:' || isLocalHost()) return false;\n    target = secureCanonicalUrl();\n    if (!target) return false;\n    try {\n      window.location.replace(target);\n      return true;\n    } catch (_) {\n      try {\n        window.location.href = target;\n        return true;\n      } catch (__) {}\n    }\n    return false;\n  }\n'''
          if 'function redirectToStrongTransport()' not in gate:
              if old_transport not in gate:
                  raise SystemExit('auth transport block was not found')
              gate = gate.replace(old_transport, new_transport, 1)

          old_handle_guard = '''    if (!hasStrongTransport()) {\n      setStatus('\\u0412\\u0445\\u043e\\u0434 \\u0440\\u0430\\u0437\\u0440\\u0435\\u0448\\u0435\\u043d \\u0442\\u043e\\u043b\\u044c\\u043a\\u043e \\u043f\\u043e HTTPS \\u0438\\u043b\\u0438 \\u043d\\u0430 localhost.', 'danger');\n      lockSubmit(true);\n      return;\n    }\n'''
          new_handle_guard = '''    if (!hasStrongTransport()) {\n      if (redirectToStrongTransport()) {\n        setStatus('\\u041f\\u0435\\u0440\\u0435\\u043d\\u0430\\u043f\\u0440\\u0430\\u0432\\u043b\\u044f\\u0435\\u043c \\u043d\\u0430 \\u0437\\u0430\\u0449\\u0438\\u0449\\u0435\\u043d\\u043d\\u0443\\u044e \\u0432\\u0435\\u0440\\u0441\\u0438\\u044e \\u043f\\u043e\\u0440\\u0442\\u0430\\u043b\\u0430...', '');\n        lockSubmit(true);\n        return;\n      }\n      setStatus('\\u0411\\u0435\\u0437\\u043e\\u043f\\u0430\\u0441\\u043d\\u044b\\u0439 \\u0432\\u0445\\u043e\\u0434 \\u0434\\u043e\\u0441\\u0442\\u0443\\u043f\\u0435\\u043d \\u043f\\u043e \\u0430\\u0434\\u0440\\u0435\\u0441\\u0443 https://\\u0445\\u0430\\u0440\\u0438\\u0437\\u043c\\u043e\\u0439.\\u0440\\u0444.', 'danger');\n      lockSubmit(true);\n      return;\n    }\n'''
          if 'Перенаправляем на защищенную версию портала' not in gate and '\\u041f\\u0435\\u0440\\u0435\\u043d\\u0430\\u043f\\u0440\\u0430\\u0432\\u043b\\u044f\\u0435\\u043c \\u043d\\u0430 \\u0437\\u0430\\u0449\\u0438\\u0449\\u0435\\u043d\\u043d\\u0443\\u044e' not in gate:
              if old_handle_guard not in gate:
                  raise SystemExit('login transport guard was not found')
              gate = gate.replace(old_handle_guard, new_handle_guard, 1)

          ensure_marker = '''  function ensureAuthenticated() {\n    authConfig();\n'''
          ensure_replacement = '''  function ensureAuthenticated() {\n    authConfig();\n    if (redirectToStrongTransport()) return Promise.resolve(null);\n'''
          if 'if (redirectToStrongTransport()) return Promise.resolve(null);' not in gate:
              if ensure_marker not in gate:
                  raise SystemExit('ensureAuthenticated marker was not found')
              gate = gate.replace(ensure_marker, ensure_replacement, 1)

          index_path.write_text(index, encoding='utf-8')
          gate_path.write_text(gate, encoding='utf-8')
          PY

      - name: Validate auth hotfix
        shell: bash
        run: |
          node --check portal-auth-gate.js
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          gate = Path('portal-auth-gate.js').read_text(encoding='utf-8')
          assert 'window.__ALTEA_CANONICAL_HTTPS_REDIRECT__ = true' in index
          assert "protocol === 'http:' && !local" in index
          assert 'portal-auth-gate.js?v=20260720macoshttps1' in index
          assert 'return window.isSecureContext === true;' in gate
          assert 'function redirectToStrongTransport()' in gate
          assert 'if (redirectToStrongTransport()) return Promise.resolve(null);' in gate
          assert "window.location.replace(target);" in gate
          PY

      - name: Commit the hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html portal-auth-gate.js
          if git diff --cached --quiet; then
            echo "Hotfix is already applied."
            exit 0
          fi
          git commit -m "Fix macOS portal login through canonical HTTPS"
          git push origin HEAD:main
