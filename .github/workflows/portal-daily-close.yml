name: Portal daily close

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_run:
    workflows: ['Portal data truth']
    types: [completed]
  workflow_dispatch:
    inputs:
      cutoff-date:
        description: 'Business cutoff YYYY-MM-DD; empty means Europe/Moscow D-1'
        required: false
      upload-runtime-data:
        description: 'Upload the complete runtime data generation for a protected portal refresh'
        required: false
        default: false
        type: boolean

concurrency:
  group: portal-daily-close
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Europe/Moscow

jobs:
  close:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci

      - name: Resolve cutoff
        id: cutoff
        shell: bash
        run: |
          VALUE='${{ github.event.inputs['cutoff-date'] }}'
          if [ -z "$VALUE" ]; then VALUE=$(TZ=Europe/Moscow date -d yesterday +%F); fi
          RUN_DATE=$(TZ=Europe/Moscow date +%F)
          REVISION_FROM=$(TZ=Europe/Moscow date -d "$VALUE -29 days" +%F)
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "revision_from=$REVISION_FROM" >> "$GITHUB_OUTPUT"

      - name: Preflight production secrets
        env:
          ALTEA_WB_API_TOKEN: ${{ secrets.ALTEA_WB_API_TOKEN }}
          ALTEA_WB_PROMOTION_TOKEN: ${{ secrets.ALTEA_WB_PROMOTION_TOKEN }}
          ALTEA_OZON_CLIENT_ID: ${{ secrets.ALTEA_OZON_CLIENT_ID }}
          ALTEA_OZON_API_KEY: ${{ secrets.ALTEA_OZON_API_KEY }}
          ALTEA_YM_API_KEY: ${{ secrets.ALTEA_YM_API_KEY }}
          ALTEA_YM_CAMPAIGN_ID: ${{ secrets.ALTEA_YM_CAMPAIGN_ID }}
          ALTEA_YM_BUSINESS_ID: ${{ secrets.ALTEA_YM_BUSINESS_ID }}
          ALTEA_ZYA_API_TOKEN: ${{ secrets.ALTEA_ZYA_API_TOKEN || secrets.ALTEA_ZYA_API_KEY || secrets.ALTEA_GOLDAPPLE_API_TOKEN || secrets.ALTEA_GOLDAPPLE_API_KEY }}
          ALTEA_ZYA_API_KEY: ${{ secrets.ALTEA_ZYA_API_KEY }}
          ALTEA_ZYA_API_BASE_URL: ${{ secrets.ALTEA_ZYA_API_BASE_URL || vars.ALTEA_ZYA_API_BASE_URL || secrets.ALTEA_GOLDAPPLE_API_BASE_URL || vars.ALTEA_GOLDAPPLE_API_BASE_URL }}
          ALTEA_ZYA_SALES_PATH: ${{ secrets.ALTEA_ZYA_SALES_PATH || vars.ALTEA_ZYA_SALES_PATH || secrets.ALTEA_GOLDAPPLE_SALES_PATH || vars.ALTEA_GOLDAPPLE_SALES_PATH }}
          ALTEA_ZYA_CLIENT_ID: ${{ secrets.ALTEA_ZYA_CLIENT_ID || vars.ALTEA_ZYA_CLIENT_ID || secrets.ALTEA_GOLDAPPLE_CLIENT_ID || vars.ALTEA_GOLDAPPLE_CLIENT_ID }}
          ALTEA_ZYA_API_METHOD: ${{ secrets.ALTEA_ZYA_API_METHOD || vars.ALTEA_ZYA_API_METHOD || secrets.ALTEA_GOLDAPPLE_API_METHOD || vars.ALTEA_GOLDAPPLE_API_METHOD }}
          ALTEA_ZYA_API_BODY_JSON: ${{ secrets.ALTEA_ZYA_API_BODY_JSON || secrets.ALTEA_GOLDAPPLE_API_BODY_JSON }}
          ALTEA_ZYA_GRAPHQL_QUERY: ${{ secrets.ALTEA_ZYA_GRAPHQL_QUERY || secrets.ALTEA_GOLDAPPLE_GRAPHQL_QUERY }}
          ALTEA_ZYA_SALES_XLSX: ${{ secrets.ALTEA_ZYA_SALES_XLSX || vars.ALTEA_ZYA_SALES_XLSX }}
          ALTEA_ZYA_SALES_ZIP: ${{ secrets.ALTEA_ZYA_SALES_ZIP || vars.ALTEA_ZYA_SALES_ZIP }}
          ALTEA_LETUAL_API_TOKEN: ${{ secrets.ALTEA_LETUAL_API_TOKEN }}
          ALTEA_LETUAL_API_BASE_URL: ${{ secrets.ALTEA_LETUAL_API_BASE_URL || vars.ALTEA_LETUAL_API_BASE_URL }}
          ALTEA_LETUAL_SALES_PATH: ${{ secrets.ALTEA_LETUAL_SALES_PATH || vars.ALTEA_LETUAL_SALES_PATH }}
          ALTEA_LETUAL_CLIENT_ID: ${{ secrets.ALTEA_LETUAL_CLIENT_ID || vars.ALTEA_LETUAL_CLIENT_ID }}
          ALTEA_LETUAL_API_METHOD: ${{ secrets.ALTEA_LETUAL_API_METHOD || vars.ALTEA_LETUAL_API_METHOD }}
          ALTEA_LETUAL_API_BODY_JSON: ${{ secrets.ALTEA_LETUAL_API_BODY_JSON }}
          ALTEA_LETUAL_GRAPHQL_QUERY: ${{ secrets.ALTEA_LETUAL_GRAPHQL_QUERY }}
          ALTEA_LETUAL_LOCAL_EXPORT_XLSX: ${{ secrets.ALTEA_LETUAL_LOCAL_EXPORT_XLSX || vars.ALTEA_LETUAL_LOCAL_EXPORT_XLSX }}
          ALTEA_MEGAMARKET_API_TOKEN: ${{ secrets.ALTEA_MEGAMARKET_API_TOKEN || secrets.ALTEA_MEGAMARKET_API_KEY }}
          ALTEA_MEGAMARKET_API_KEY: ${{ secrets.ALTEA_MEGAMARKET_API_KEY }}
          ALTEA_MEGAMARKET_API_BASE_URL: ${{ secrets.ALTEA_MEGAMARKET_API_BASE_URL || vars.ALTEA_MEGAMARKET_API_BASE_URL }}
          ALTEA_MEGAMARKET_SALES_PATH: ${{ secrets.ALTEA_MEGAMARKET_SALES_PATH || vars.ALTEA_MEGAMARKET_SALES_PATH }}
          ALTEA_MEGAMARKET_CLIENT_ID: ${{ secrets.ALTEA_MEGAMARKET_CLIENT_ID || vars.ALTEA_MEGAMARKET_CLIENT_ID }}
          ALTEA_MEGAMARKET_API_METHOD: ${{ secrets.ALTEA_MEGAMARKET_API_METHOD || vars.ALTEA_MEGAMARKET_API_METHOD }}
          ALTEA_MEGAMARKET_API_BODY_JSON: ${{ secrets.ALTEA_MEGAMARKET_API_BODY_JSON }}
          ALTEA_MEGAMARKET_GRAPHQL_QUERY: ${{ secrets.ALTEA_MEGAMARKET_GRAPHQL_QUERY }}
          ALTEA_SAMOKAT_API_TOKEN: ${{ secrets.ALTEA_SAMOKAT_API_TOKEN || secrets.ALTEA_SAMOKAT_API_KEY }}
          ALTEA_SAMOKAT_API_KEY: ${{ secrets.ALTEA_SAMOKAT_API_KEY }}
          ALTEA_SAMOKAT_API_BASE_URL: ${{ secrets.ALTEA_SAMOKAT_API_BASE_URL || vars.ALTEA_SAMOKAT_API_BASE_URL }}
          ALTEA_SAMOKAT_SALES_PATH: ${{ secrets.ALTEA_SAMOKAT_SALES_PATH || vars.ALTEA_SAMOKAT_SALES_PATH }}
          ALTEA_SAMOKAT_CLIENT_ID: ${{ secrets.ALTEA_SAMOKAT_CLIENT_ID || vars.ALTEA_SAMOKAT_CLIENT_ID }}
          ALTEA_SAMOKAT_API_METHOD: ${{ secrets.ALTEA_SAMOKAT_API_METHOD || vars.ALTEA_SAMOKAT_API_METHOD }}
          ALTEA_SAMOKAT_API_BODY_JSON: ${{ secrets.ALTEA_SAMOKAT_API_BODY_JSON }}
          ALTEA_SAMOKAT_GRAPHQL_QUERY: ${{ secrets.ALTEA_SAMOKAT_GRAPHQL_QUERY }}
          ALTEA_MAGNIT_API_TOKEN: ${{ secrets.ALTEA_MAGNIT_API_TOKEN || secrets.ALTEA_MAGNIT_API_KEY || secrets.ALTEA_MAGNIT_MARKET_API_TOKEN || secrets.ALTEA_MAGNIT_MARKET_API_KEY }}
          ALTEA_MAGNIT_API_KEY: ${{ secrets.ALTEA_MAGNIT_API_KEY }}
          ALTEA_MAGNIT_MARKET_API_TOKEN: ${{ secrets.ALTEA_MAGNIT_MARKET_API_TOKEN }}
          ALTEA_MAGNIT_MARKET_API_KEY: ${{ secrets.ALTEA_MAGNIT_MARKET_API_KEY }}
          ALTEA_MAGNIT_API_BASE_URL: ${{ secrets.ALTEA_MAGNIT_API_BASE_URL || vars.ALTEA_MAGNIT_API_BASE_URL || secrets.ALTEA_MAGNIT_MARKET_API_BASE_URL || vars.ALTEA_MAGNIT_MARKET_API_BASE_URL }}
          ALTEA_MAGNIT_SALES_PATH: ${{ secrets.ALTEA_MAGNIT_SALES_PATH || vars.ALTEA_MAGNIT_SALES_PATH || secrets.ALTEA_MAGNIT_MARKET_SALES_PATH || vars.ALTEA_MAGNIT_MARKET_SALES_PATH }}
          ALTEA_MAGNIT_CLIENT_ID: ${{ secrets.ALTEA_MAGNIT_CLIENT_ID || vars.ALTEA_MAGNIT_CLIENT_ID || secrets.ALTEA_MAGNIT_MARKET_CLIENT_ID || vars.ALTEA_MAGNIT_MARKET_CLIENT_ID }}
          ALTEA_MAGNIT_API_METHOD: ${{ secrets.ALTEA_MAGNIT_API_METHOD || vars.ALTEA_MAGNIT_API_METHOD || secrets.ALTEA_MAGNIT_MARKET_API_METHOD || vars.ALTEA_MAGNIT_MARKET_API_METHOD }}
          ALTEA_MAGNIT_API_BODY_JSON: ${{ secrets.ALTEA_MAGNIT_API_BODY_JSON || secrets.ALTEA_MAGNIT_MARKET_API_BODY_JSON }}
          ALTEA_MAGNIT_GRAPHQL_QUERY: ${{ secrets.ALTEA_MAGNIT_GRAPHQL_QUERY || secrets.ALTEA_MAGNIT_MARKET_GRAPHQL_QUERY }}
          ALTEA_MAGNIT_SALES_XLSX: ${{ secrets.ALTEA_MAGNIT_SALES_XLSX || vars.ALTEA_MAGNIT_SALES_XLSX }}
          ALTEA_MAGNIT_SALES_XLS: ${{ secrets.ALTEA_MAGNIT_SALES_XLS || vars.ALTEA_MAGNIT_SALES_XLS }}
          ALTEA_MAGNIT_SALES_WORKBOOK: ${{ secrets.ALTEA_MAGNIT_SALES_WORKBOOK || vars.ALTEA_MAGNIT_SALES_WORKBOOK }}
          ALTEA_MAGNIT_SALES_CSV: ${{ secrets.ALTEA_MAGNIT_SALES_CSV || vars.ALTEA_MAGNIT_SALES_CSV }}
          ALTEA_MAGNIT_SERVICES_CSV: ${{ secrets.ALTEA_MAGNIT_SERVICES_CSV || vars.ALTEA_MAGNIT_SERVICES_CSV }}
          ALTEA_RETAIL_NETWORK_SALES_XLSX: ${{ secrets.ALTEA_RETAIL_NETWORK_SALES_XLSX || vars.ALTEA_RETAIL_NETWORK_SALES_XLSX || 'data/external_sources/retail_network_sales.xlsx' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://iyckwryrucqrxwlowxow.supabase.co' }}
          ALTEA_SUPABASE_URL: ${{ secrets.ALTEA_SUPABASE_URL || vars.ALTEA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.ALTEA_SUPABASE_SERVICE_ROLE_KEY }}
          ALTEA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ALTEA_SUPABASE_SERVICE_ROLE_KEY }}
          ALTEA_SMART_PRICE_SHEET_URL: ${{ secrets.ALTEA_SMART_PRICE_SHEET_URL || vars.ALTEA_SMART_PRICE_SHEET_URL }}
          ALTEA_SMART_PRICE_EXPORT_URL: ${{ secrets.ALTEA_SMART_PRICE_EXPORT_URL || vars.ALTEA_SMART_PRICE_EXPORT_URL }}
          ALTEA_SMART_PRICE_XLSX_URL: ${{ secrets.ALTEA_SMART_PRICE_XLSX_URL || vars.ALTEA_SMART_PRICE_XLSX_URL }}
          ALTEA_SMART_PRICE_INPUT_XLSX: ${{ vars.ALTEA_SMART_PRICE_INPUT_XLSX }}
          ALTEA_SMART_PRICE_XLSX_B64: ${{ secrets.ALTEA_SMART_PRICE_XLSX_B64 }}
          ALTEA_SMART_PRICE_XLSX_GZIP_B64: ${{ secrets.ALTEA_SMART_PRICE_XLSX_GZIP_B64 }}
          ALTEA_SMART_PRICE_SOURCE_MTIME: ${{ secrets.ALTEA_SMART_PRICE_SOURCE_MTIME || vars.ALTEA_SMART_PRICE_SOURCE_MTIME }}
          ALTEA_SMART_PRICE_GOOGLE_FILE_ID: ${{ secrets.ALTEA_SMART_PRICE_GOOGLE_FILE_ID || vars.ALTEA_SMART_PRICE_GOOGLE_FILE_ID }}
          ALTEA_SMART_PRICE_HTTP_AUTH_BEARER: ${{ secrets.ALTEA_SMART_PRICE_HTTP_AUTH_BEARER || github.token }}
          ALTEA_SMART_PRICE_HTTP_AUTH_HEADER: ${{ secrets.ALTEA_SMART_PRICE_HTTP_AUTH_HEADER }}
          ALTEA_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.ALTEA_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: >-
          node scripts/portal-daily-close-preflight.js
          --output-dir .portal-truth-output
          --cutoff-date '${{ steps.cutoff.outputs.value }}'
          --revision-from '${{ steps.cutoff.outputs.revision_from }}'

      - name: Summarize preflight blockers
        if: always()
        run: node scripts/portal-daily-close-preflight-summary.js --report .portal-truth-output/portal_daily_close_preflight.json

      - name: Refresh marketplace facts and rolling revisions
        env:
          ALTEA_WB_API_TOKEN: ${{ secrets.ALTEA_WB_API_TOKEN }}
          ALTEA_WB_FINANCE_TOKEN: ${{ secrets.ALTEA_WB_FINANCE_TOKEN }}
          ALTEA_WB_PROMOTION_TOKEN: ${{ secrets.ALTEA_WB_PROMOTION_TOKEN }}
          ALTEA_OZON_CLIENT_ID: ${{ secrets.ALTEA_OZON_CLIENT_ID }}
          ALTEA_OZON_API_KEY: ${{ secrets.ALTEA_OZON_API_KEY }}
          ALTEA_YM_API_KEY: ${{ secrets.ALTEA_YM_API_KEY }}
          ALTEA_YM_CAMPAIGN_ID: ${{ secrets.ALTEA_YM_CAMPAIGN_ID }}
          ALTEA_YM_BUSINESS_ID: ${{ secrets.ALTEA_YM_BUSINESS_ID }}
          ALTEA_ZYA_API_TOKEN: ${{ secrets.ALTEA_ZYA_API_TOKEN || secrets.ALTEA_ZYA_API_KEY || secrets.ALTEA_GOLDAPPLE_API_TOKEN || secrets.ALTEA_GOLDAPPLE_API_KEY }}
          ALTEA_ZYA_API_KEY: ${{ secrets.ALTEA_ZYA_API_KEY }}
          ALTEA_ZYA_API_BASE_URL: ${{ secrets.ALTEA_ZYA_API_BASE_URL || vars.ALTEA_ZYA_API_BASE_URL || secrets.ALTEA_GOLDAPPLE_API_BASE_URL || vars.ALTEA_GOLDAPPLE_API_BASE_URL }}
          ALTEA_ZYA_SALES_PATH: ${{ secrets.ALTEA_ZYA_SALES_PATH || vars.ALTEA_ZYA_SALES_PATH || secrets.ALTEA_GOLDAPPLE_SALES_PATH || vars.ALTEA_GOLDAPPLE_SALES_PATH }}
          ALTEA_ZYA_CLIENT_ID: ${{ secrets.ALTEA_ZYA_CLIENT_ID || vars.ALTEA_ZYA_CLIENT_ID || secrets.ALTEA_GOLDAPPLE_CLIENT_ID || vars.ALTEA_GOLDAPPLE_CLIENT_ID }}
          ALTEA_ZYA_API_METHOD: ${{ secrets.ALTEA_ZYA_API_METHOD || vars.ALTEA_ZYA_API_METHOD || secrets.ALTEA_GOLDAPPLE_API_METHOD || vars.ALTEA_GOLDAPPLE_API_METHOD }}
          ALTEA_ZYA_API_BODY_JSON: ${{ secrets.ALTEA_ZYA_API_BODY_JSON || secrets.ALTEA_GOLDAPPLE_API_BODY_JSON }}
          ALTEA_ZYA_GRAPHQL_QUERY: ${{ secrets.ALTEA_ZYA_GRAPHQL_QUERY || secrets.ALTEA_GOLDAPPLE_GRAPHQL_QUERY }}
          ALTEA_ZYA_SALES_XLSX: ${{ secrets.ALTEA_ZYA_SALES_XLSX || vars.ALTEA_ZYA_SALES_XLSX }}
          ALTEA_ZYA_SALES_ZIP: ${{ secrets.ALTEA_ZYA_SALES_ZIP || vars.ALTEA_ZYA_SALES_ZIP }}
          ALTEA_LETUAL_API_TOKEN: ${{ secrets.ALTEA_LETUAL_API_TOKEN }}
          ALTEA_LETUAL_API_BASE_URL: ${{ secrets.ALTEA_LETUAL_API_BASE_URL || vars.ALTEA_LETUAL_API_BASE_URL }}
          ALTEA_LETUAL_SALES_PATH: ${{ secrets.ALTEA_LETUAL_SALES_PATH || vars.ALTEA_LETUAL_SALES_PATH }}
          ALTEA_LETUAL_CLIENT_ID: ${{ secrets.ALTEA_LETUAL_CLIENT_ID || vars.ALTEA_LETUAL_CLIENT_ID }}
          ALTEA_LETUAL_API_METHOD: ${{ secrets.ALTEA_LETUAL_API_METHOD || vars.ALTEA_LETUAL_API_METHOD }}
          ALTEA_LETUAL_API_BODY_JSON: ${{ secrets.ALTEA_LETUAL_API_BODY_JSON }}
          ALTEA_LETUAL_GRAPHQL_QUERY: ${{ secrets.ALTEA_LETUAL_GRAPHQL_QUERY }}
          ALTEA_LETUAL_LOCAL_EXPORT_XLSX: ${{ secrets.ALTEA_LETUAL_LOCAL_EXPORT_XLSX || vars.ALTEA_LETUAL_LOCAL_EXPORT_XLSX }}
          ALTEA_MEGAMARKET_API_TOKEN: ${{ secrets.ALTEA_MEGAMARKET_API_TOKEN || secrets.ALTEA_MEGAMARKET_API_KEY }}
          ALTEA_MEGAMARKET_API_KEY: ${{ secrets.ALTEA_MEGAMARKET_API_KEY }}
          ALTEA_MEGAMARKET_API_BASE_URL: ${{ secrets.ALTEA_MEGAMARKET_API_BASE_URL || vars.ALTEA_MEGAMARKET_API_BASE_URL }}
          ALTEA_MEGAMARKET_SALES_PATH: ${{ secrets.ALTEA_MEGAMARKET_SALES_PATH || vars.ALTEA_MEGAMARKET_SALES_PATH }}
          ALTEA_MEGAMARKET_CLIENT_ID: ${{ secrets.ALTEA_MEGAMARKET_CLIENT_ID || vars.ALTEA_MEGAMARKET_CLIENT_ID }}
          ALTEA_MEGAMARKET_API_METHOD: ${{ secrets.ALTEA_MEGAMARKET_API_METHOD || vars.ALTEA_MEGAMARKET_API_METHOD }}
          ALTEA_MEGAMARKET_API_BODY_JSON: ${{ secrets.ALTEA_MEGAMARKET_API_BODY_JSON }}
          ALTEA_MEGAMARKET_GRAPHQL_QUERY: ${{ secrets.ALTEA_MEGAMARKET_GRAPHQL_QUERY }}
          ALTEA_SAMOKAT_API_TOKEN: ${{ secrets.ALTEA_SAMOKAT_API_TOKEN || secrets.ALTEA_SAMOKAT_API_KEY }}
          ALTEA_SAMOKAT_API_KEY: ${{ secrets.ALTEA_SAMOKAT_API_KEY }}
          ALTEA_SAMOKAT_API_BASE_URL: ${{ secrets.ALTEA_SAMOKAT_API_BASE_URL || vars.ALTEA_SAMOKAT_API_BASE_URL }}
          ALTEA_SAMOKAT_SALES_PATH: ${{ secrets.ALTEA_SAMOKAT_SALES_PATH || vars.ALTEA_SAMOKAT_SALES_PATH }}
          ALTEA_SAMOKAT_CLIENT_ID: ${{ secrets.ALTEA_SAMOKAT_CLIENT_ID || vars.ALTEA_SAMOKAT_CLIENT_ID }}
          ALTEA_SAMOKAT_API_METHOD: ${{ secrets.ALTEA_SAMOKAT_API_METHOD || vars.ALTEA_SAMOKAT_API_METHOD }}
          ALTEA_SAMOKAT_API_BODY_JSON: ${{ secrets.ALTEA_SAMOKAT_API_BODY_JSON }}
          ALTEA_SAMOKAT_GRAPHQL_QUERY: ${{ secrets.ALTEA_SAMOKAT_GRAPHQL_QUERY }}
          ALTEA_MAGNIT_API_TOKEN: ${{ secrets.ALTEA_MAGNIT_API_TOKEN || secrets.ALTEA_MAGNIT_API_KEY || secrets.ALTEA_MAGNIT_MARKET_API_TOKEN || secrets.ALTEA_MAGNIT_MARKET_API_KEY }}
          ALTEA_MAGNIT_API_KEY: ${{ secrets.ALTEA_MAGNIT_API_KEY }}
          ALTEA_MAGNIT_MARKET_API_TOKEN: ${{ secrets.ALTEA_MAGNIT_MARKET_API_TOKEN }}
          ALTEA_MAGNIT_MARKET_API_KEY: ${{ secrets.ALTEA_MAGNIT_MARKET_API_KEY }}
          ALTEA_MAGNIT_API_BASE_URL: ${{ secrets.ALTEA_MAGNIT_API_BASE_URL || vars.ALTEA_MAGNIT_API_BASE_URL || secrets.ALTEA_MAGNIT_MARKET_API_BASE_URL || vars.ALTEA_MAGNIT_MARKET_API_BASE_URL }}
          ALTEA_MAGNIT_SALES_PATH: ${{ secrets.ALTEA_MAGNIT_SALES_PATH || vars.ALTEA_MAGNIT_SALES_PATH || secrets.ALTEA_MAGNIT_MARKET_SALES_PATH || vars.ALTEA_MAGNIT_MARKET_SALES_PATH }}
          ALTEA_MAGNIT_CLIENT_ID: ${{ secrets.ALTEA_MAGNIT_CLIENT_ID || vars.ALTEA_MAGNIT_CLIENT_ID || secrets.ALTEA_MAGNIT_MARKET_CLIENT_ID || vars.ALTEA_MAGNIT_MARKET_CLIENT_ID }}
          ALTEA_MAGNIT_API_METHOD: ${{ secrets.ALTEA_MAGNIT_API_METHOD || vars.ALTEA_MAGNIT_API_METHOD || secrets.ALTEA_MAGNIT_MARKET_API_METHOD || vars.ALTEA_MAGNIT_MARKET_API_METHOD }}
          ALTEA_MAGNIT_API_BODY_JSON: ${{ secrets.ALTEA_MAGNIT_API_BODY_JSON || secrets.ALTEA_MAGNIT_MARKET_API_BODY_JSON }}
          ALTEA_MAGNIT_GRAPHQL_QUERY: ${{ secrets.ALTEA_MAGNIT_GRAPHQL_QUERY || secrets.ALTEA_MAGNIT_MARKET_GRAPHQL_QUERY }}
          ALTEA_MAGNIT_SALES_XLSX: ${{ secrets.ALTEA_MAGNIT_SALES_XLSX || vars.ALTEA_MAGNIT_SALES_XLSX }}
          ALTEA_MAGNIT_SALES_XLS: ${{ secrets.ALTEA_MAGNIT_SALES_XLS || vars.ALTEA_MAGNIT_SALES_XLS }}
          ALTEA_MAGNIT_SALES_WORKBOOK: ${{ secrets.ALTEA_MAGNIT_SALES_WORKBOOK || vars.ALTEA_MAGNIT_SALES_WORKBOOK }}
          ALTEA_MAGNIT_SALES_CSV: ${{ secrets.ALTEA_MAGNIT_SALES_CSV || vars.ALTEA_MAGNIT_SALES_CSV }}
          ALTEA_MAGNIT_SERVICES_CSV: ${{ secrets.ALTEA_MAGNIT_SERVICES_CSV || vars.ALTEA_MAGNIT_SERVICES_CSV }}
          ALTEA_RETAIL_NETWORK_SALES_XLSX: ${{ secrets.ALTEA_RETAIL_NETWORK_SALES_XLSX || vars.ALTEA_RETAIL_NETWORK_SALES_XLSX || 'data/external_sources/retail_network_sales.xlsx' }}
        run: >-
          node scripts/portal-api-max-sync.js sync
          --mode daily --recent-days 30
          --platforms wb,ozon,ya,samokat,magnit
          --to '${{ steps.cutoff.outputs.value }}'
          --strict --skip-protected-scope --skip-health --skip-data-guard --skip-magnit-csv

      - name: Refresh retail-network daily facts
        env:
          ALTEA_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.ALTEA_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          ALTEA_RETAIL_NETWORK_GOOGLE_SHEET_ID: ${{ secrets.ALTEA_RETAIL_NETWORK_GOOGLE_SHEET_ID || vars.ALTEA_RETAIL_NETWORK_GOOGLE_SHEET_ID || '1Zy0ec9-snLwh-J88KoFXyHxtYg3DXC8oWnC17iHNNS4' }}
        run: |
          RETAIL_FROM="$(date -u -d '${{ steps.cutoff.outputs.value }} - 1 day' +%F)"
          node scripts/portal-retail-network-daily-sync.js sync \
            --input-file data/platform_trends.json \
            --output-file data/platform_trends.json \
            --status-file data/retail_network_source_status.json \
            --from "$RETAIL_FROM" \
            --to '${{ steps.cutoff.outputs.value }}' \
            --strict --optional-source --max-lag-days 1 \
            --allow-stale-platforms letu

      - name: Refresh advertising and stock
        env:
          ALTEA_WB_PROMOTION_TOKEN: ${{ secrets.ALTEA_WB_PROMOTION_TOKEN }}
          ALTEA_WB_FEEDBACKS_TOKEN: ${{ secrets.ALTEA_WB_FEEDBACKS_TOKEN }}
          ALTEA_WB_API_TOKEN: ${{ secrets.ALTEA_WB_API_TOKEN }}
          ALTEA_OZON_CLIENT_ID: ${{ secrets.ALTEA_OZON_CLIENT_ID }}
          ALTEA_OZON_API_KEY: ${{ secrets.ALTEA_OZON_API_KEY }}
          ALTEA_YM_API_KEY: ${{ secrets.ALTEA_YM_API_KEY }}
          ALTEA_YM_CAMPAIGN_ID: ${{ secrets.ALTEA_YM_CAMPAIGN_ID }}
          ALTEA_YM_BUSINESS_ID: ${{ secrets.ALTEA_YM_BUSINESS_ID }}
        run: |
          node scripts/portal-wb-ads-sync.js sync --from '${{ steps.cutoff.outputs.revision_from }}' --to '${{ steps.cutoff.outputs.value }}' --no-fixture-fallback --no-external-ads
          node scripts/portal-ozon-ads-finance-sync.js sync --from '${{ steps.cutoff.outputs.revision_from }}' --to '${{ steps.cutoff.outputs.value }}'
          node scripts/portal-wb-feedback-sync.js sync --input-dir data --base-data-dir data --output-dir data --from '${{ steps.cutoff.outputs.revision_from }}' --to '${{ steps.cutoff.outputs.value }}'
          node scripts/portal-yandex-market-stock-sync.js sync
          node scripts/portal-warehouse-stock-sync.js sync

      - name: Build canonical portal layers
        env:
          ALTEA_OZON_CLIENT_ID: ${{ secrets.ALTEA_OZON_CLIENT_ID }}
          ALTEA_OZON_API_KEY: ${{ secrets.ALTEA_OZON_API_KEY }}
          ALTEA_SMART_PRICE_SHEET_URL: ${{ secrets.ALTEA_SMART_PRICE_SHEET_URL || vars.ALTEA_SMART_PRICE_SHEET_URL }}
          ALTEA_SMART_PRICE_EXPORT_URL: ${{ secrets.ALTEA_SMART_PRICE_EXPORT_URL || vars.ALTEA_SMART_PRICE_EXPORT_URL }}
          ALTEA_SMART_PRICE_XLSX_URL: ${{ secrets.ALTEA_SMART_PRICE_XLSX_URL || vars.ALTEA_SMART_PRICE_XLSX_URL }}
          ALTEA_SMART_PRICE_INPUT_XLSX: ${{ vars.ALTEA_SMART_PRICE_INPUT_XLSX }}
          ALTEA_SMART_PRICE_XLSX_B64: ${{ secrets.ALTEA_SMART_PRICE_XLSX_B64 }}
          ALTEA_SMART_PRICE_XLSX_GZIP_B64: ${{ secrets.ALTEA_SMART_PRICE_XLSX_GZIP_B64 }}
          ALTEA_SMART_PRICE_SOURCE_MTIME: ${{ secrets.ALTEA_SMART_PRICE_SOURCE_MTIME || vars.ALTEA_SMART_PRICE_SOURCE_MTIME }}
          ALTEA_SMART_PRICE_GOOGLE_FILE_ID: ${{ secrets.ALTEA_SMART_PRICE_GOOGLE_FILE_ID || vars.ALTEA_SMART_PRICE_GOOGLE_FILE_ID }}
          ALTEA_SMART_PRICE_HTTP_AUTH_BEARER: ${{ secrets.ALTEA_SMART_PRICE_HTTP_AUTH_BEARER || github.token }}
          ALTEA_SMART_PRICE_HTTP_AUTH_HEADER: ${{ secrets.ALTEA_SMART_PRICE_HTTP_AUTH_HEADER }}
          ALTEA_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.ALTEA_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          mkdir -p .portal-truth-output
          mkdir -p .portal-truth-output/price-sync
          SMART_PRICE_INPUT_ARGS=()
          if [[ "${ALTEA_SMART_PRICE_XLSX_URL:-}" == https://api.github.com/repos/*/releases/assets/* || "${ALTEA_SMART_PRICE_XLSX_URL:-}" == https://github.com/*/releases/download/* ]]; then
            SMART_PRICE_CURL_ARGS=(--fail --location --retry 5 --retry-delay 2 --retry-all-errors -H "Accept: application/octet-stream")
            if [[ "${ALTEA_SMART_PRICE_XLSX_URL:-}" == https://api.github.com/repos/*/releases/assets/* && -n "${ALTEA_SMART_PRICE_HTTP_AUTH_BEARER:-}" ]]; then
              SMART_PRICE_CURL_ARGS+=(-H "Authorization: Bearer ${ALTEA_SMART_PRICE_HTTP_AUTH_BEARER}")
            fi
            curl "${SMART_PRICE_CURL_ARGS[@]}" \
              --output .portal-truth-output/price-sync/smart-price-workbook.xlsx \
              "$ALTEA_SMART_PRICE_XLSX_URL"
            if [ -n "${ALTEA_SMART_PRICE_SOURCE_MTIME:-}" ]; then
              touch -d "$ALTEA_SMART_PRICE_SOURCE_MTIME" .portal-truth-output/price-sync/smart-price-workbook.xlsx
            fi
            SMART_PRICE_INPUT_ARGS=(--input-xlsx .portal-truth-output/price-sync/smart-price-workbook.xlsx)
          fi
          node scripts/build-sku-registry-meta.js --input-dir data --output-dir data --run-date '${{ steps.cutoff.outputs.run_date }}'
          node scripts/build-logistics-from-warehouse-overlay.js --input-dir data --output-dir data --run-date '${{ steps.cutoff.outputs.run_date }}'
          node scripts/portal-smart-price-overlay-sync.js sync --output-dir .portal-truth-output/price-sync "${SMART_PRICE_INPUT_ARGS[@]}"
          node scripts/build-order-procurement-layer.js
          node scripts/build-oos-control-layer.js --input-dir data --base-data-dir data --output-dir data
          node scripts/build-wb-owner-audit-from-skus.js --input-dir data --base-data-dir data --output-dir data --run-date '${{ steps.cutoff.outputs.run_date }}'
          node scripts/build-portal-data-quality-report.js --input-dir data --base-data-dir data --output-dir data --run-date '${{ steps.cutoff.outputs.run_date }}'
          node scripts/portal-sync-health.js --input-dir data --base-data-dir data --output-dir data --quarantine-only
          node scripts/build-sku-matrix-layer.js --input-dir data --base-data-dir data --output-dir data
          node scripts/build-canonical-repricer.js --input-dir data --output-dir data
          node scripts/build-wb-fixed-rate-report.js --output data/wb_fixed_rate_reports.json --optional
          node scripts/build-wb-iu-logic-rules.js --report data/wb_fixed_rate_reports.json --output data/wb_iu_logic_rules.json
          node scripts/build-iu-drr-summary.js --input-dir data --base-data-dir data --output-dir data --from '${{ steps.cutoff.outputs.revision_from }}' --to '${{ steps.cutoff.outputs.value }}'
          node scripts/build-portal-dashboard-metrics.js --input-dir data --output-dir data
          node scripts/build-portal-dashboard.js --input-dir data --output-dir data
          node scripts/build-product-leaderboard-history.js
          node scripts/build-wb-sales-funnel-from-platform-trends.js --platform-trends data/platform_trends.json --skus data/skus.json --wb-feedbacks data/wb_feedbacks_summary.json --output-file data/wb_sales_funnel_report.json --to '${{ steps.cutoff.outputs.value }}'
          node scripts/portal-upload-apply-runtime.js --input-dir data --output-dir data
          node scripts/build-control-auto-task-sources.js --input-dir data --output-dir data
          node scripts/portal-sync-health.js --input-dir data --base-data-dir data --output-dir data --expected-date '${{ steps.cutoff.outputs.value }}'
          node scripts/build-oos-control-layer.js --input-dir data --base-data-dir data --output-dir data
          node scripts/portal-sync-health.js --input-dir data --base-data-dir data --output-dir data --expected-date '${{ steps.cutoff.outputs.value }}'

      - name: D-1 and numeric gates
        run: |
          python scripts/d1_close_gate.py --policy data/portal_daily_source_policy.json --input-dir data --base-data-dir data --output-dir .portal-truth-output --expected-date '${{ steps.cutoff.outputs.value }}' --skip-protected-scope
          node scripts/portal-daily-layer-guard.js --input-dir data --base-data-dir data --output-dir .portal-truth-output --expected-date '${{ steps.cutoff.outputs.value }}' --expected-run-date '${{ steps.cutoff.outputs.run_date }}'

      - name: Package active generation
        run: |
          node scripts/portal-atomic-snapshot-finalize.js --data-dir data --output-dir .portal-truth-output
          python scripts/verify_snapshot_manifest.py --repo . --manifest data/active_snapshot.json --inventory data/runtime_snapshot_inventory.json

      - name: Publish generation and verify readback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://iyckwryrucqrxwlowxow.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.ALTEA_SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python scripts/sync_portal_generation_to_supabase.py
          --manifest data/active_snapshot.json
          --supabase-url "$SUPABASE_URL"
          --supabase-key "$SUPABASE_SERVICE_ROLE_KEY"
          --verify-readback

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-daily-close-${{ github.run_id }}
          path: |
            .portal-truth-output/**
            data/active_snapshot.json
            data/portal_dashboard_metrics.json
            data/portal_dashboard_reconciliation.json
            data/portal_plan_reconciliation.json
            data/portal_indicator_audit.json
            data/portal_repricing_reconciliation.json
            data/product_leaderboard_history.json
            data/portal_upload_apply_e2e.json
            data/portal_minmax_upload_reconciliation.json
            data/portal_cost_upload_reconciliation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload-runtime-data
        with:
          name: portal-runtime-data-${{ github.run_id }}
          path: data/**
          if-no-files-found: error
          retention-days: 7
