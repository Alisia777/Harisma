name: Repricer live prices

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      requested_by:
        description: Portal user who requested the refresh
        required: false
        type: string

concurrency:
  group: portal-repricer-live-prices
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Europe/Moscow

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve run date
        id: run_date
        shell: bash
        run: echo "value=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check protected credentials
        env:
          ALTEA_WB_API_TOKEN: ${{ secrets.ALTEA_WB_API_TOKEN }}
          ALTEA_WB_PROMOTION_TOKEN: ${{ secrets.ALTEA_WB_PROMOTION_TOKEN }}
          ALTEA_OZON_CLIENT_ID: ${{ secrets.ALTEA_OZON_CLIENT_ID }}
          ALTEA_OZON_API_KEY: ${{ secrets.ALTEA_OZON_API_KEY }}
          ALTEA_YM_API_KEY: ${{ secrets.ALTEA_YM_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.ALTEA_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          for name in ALTEA_WB_API_TOKEN ALTEA_WB_PROMOTION_TOKEN ALTEA_OZON_CLIENT_ID ALTEA_OZON_API_KEY ALTEA_YM_API_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done

      - name: Hydrate previous price and market observations
        env:
          ALTEA_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://iyckwryrucqrxwlowxow.supabase.co' }}
          ALTEA_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.ALTEA_SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/portal-snapshot-pull.js
          --output-dir .portal-truth-output/repricer-previous
          --snapshot repricer_price_observation_history,repricer_market_observation_history,repricer_competitor_prices,repricer_competitor_history,repricer_live_prices

      - name: Refresh advertising facts used by margin
        env:
          ALTEA_WB_PROMOTION_TOKEN: ${{ secrets.ALTEA_WB_PROMOTION_TOKEN }}
          ALTEA_WB_API_TOKEN: ${{ secrets.ALTEA_WB_API_TOKEN }}
          ALTEA_OZON_CLIENT_ID: ${{ secrets.ALTEA_OZON_CLIENT_ID }}
          ALTEA_OZON_API_KEY: ${{ secrets.ALTEA_OZON_API_KEY }}
        shell: bash
        run: |
          ADS_FROM="$(date -u -d '${{ steps.run_date.outputs.value }} - 30 days' +%F)"
          node scripts/portal-wb-ads-sync.js sync \
            --from "$ADS_FROM" \
            --to '${{ steps.run_date.outputs.value }}' \
            --no-fixture-fallback \
            --no-external-ads
          node scripts/portal-ozon-ads-finance-sync.js sync \
            --from "$ADS_FROM" \
            --to '${{ steps.run_date.outputs.value }}'

      - name: Collect current WB, Ozon and Yandex Market prices
        env:
          ALTEA_WB_API_TOKEN: ${{ secrets.ALTEA_WB_API_TOKEN }}
          ALTEA_WB_PROMOTION_TOKEN: ${{ secrets.ALTEA_WB_PROMOTION_TOKEN }}
          ALTEA_OZON_CLIENT_ID: ${{ secrets.ALTEA_OZON_CLIENT_ID }}
          ALTEA_OZON_API_KEY: ${{ secrets.ALTEA_OZON_API_KEY }}
          ALTEA_YM_API_KEY: ${{ secrets.ALTEA_YM_API_KEY }}
          ALTEA_YM_CAMPAIGN_ID: ${{ secrets.ALTEA_YM_CAMPAIGN_ID }}
        run: |
          mkdir -p .portal-truth-output/repricer-live
          node scripts/portal-yandex-market-price-sync.js \
            --output-file .portal-truth-output/repricer-live/yandex-market-prices.json \
            --as-of-date '${{ steps.run_date.outputs.value }}' \
            --min-mapped-rows 100 \
            --min-mapped-ratio 0.95
          node scripts/portal-repricer-live-prices-sync.js sync \
            --input-dir data \
            --output data/repricer_live_prices.json \
            --as-of-date '${{ steps.run_date.outputs.value }}' \
            --strict
          node scripts/portal-repricer-live-prices-merge.js \
            --base data/repricer_live_prices.json \
            --additional-price-file .portal-truth-output/repricer-live/yandex-market-prices.json \
            --output data/repricer_live_prices.json \
            --as-of-date '${{ steps.run_date.outputs.value }}' \
            --required-platform ym \
            --strict
          node scripts/portal-repricer-live-signals-sync.js sync \
            --input-dir data \
            --output data/repricer_live_signals.json \
            --as-of-date '${{ steps.run_date.outputs.value }}' \
            --strict
          node scripts/build-repricer-price-observation-history.js \
            --history .portal-truth-output/repricer-previous/repricer_price_observation_history.json \
            --previous .portal-truth-output/repricer-previous/repricer_live_prices.json \
            --current data/repricer_live_prices.json \
            --output data/repricer_price_observation_history.json \
            --as-of-date '${{ steps.run_date.outputs.value }}' \
            --retention-days 90
          node scripts/build-repricer-market-observation-history.js \
            --input-dir data \
            --history .portal-truth-output/repricer-previous/repricer_market_observation_history.json \
            --output data/repricer_market_observation_history.json \
            --as-of-date '${{ steps.run_date.outputs.value }}' \
            --retention-days 400

      - name: Collect trusted competitor prices
        env:
          ALTEA_REPRICER_COMPETITOR_FEED_URL: ${{ secrets.ALTEA_REPRICER_COMPETITOR_FEED_URL || vars.ALTEA_REPRICER_COMPETITOR_FEED_URL }}
        run: >-
          node scripts/portal-repricer-competitor-sync.js sync
          --input-dir data
          --previous .portal-truth-output/repricer-previous/repricer_competitor_prices.json
          --output data/repricer_competitor_prices.json
          --as-of-date '${{ steps.run_date.outputs.value }}'
          --max-skus 60
          --delay-ms 1200

      - name: Append trusted competitor snapshot history
        run: >-
          node scripts/build-repricer-competitor-history.js
          --input-dir data
          --history .portal-truth-output/repricer-previous/repricer_competitor_history.json
          --current data/repricer_competitor_prices.json
          --output data/repricer_competitor_history.json
          --as-of-date '${{ steps.run_date.outputs.value }}'
          --retention-days 180

      - name: Materialize approved portal decisions
        env:
          ALTEA_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://iyckwryrucqrxwlowxow.supabase.co' }}
          ALTEA_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.ALTEA_SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/materialize-repricer-approved-decisions.js
          --remote --strict
          --input-dir data
          --output-dir data

      - name: Rebuild protected repricer layers
        run: |
          node scripts/build-canonical-repricer.js \
            --input-dir data \
            --output-dir data \
            --competitor-prices data/repricer_competitor_prices.json \
            --as-of-date '${{ steps.run_date.outputs.value }}'
          node scripts/build-repricer-team-policy.js \
            --input-dir data \
            --output data/repricer_team_policy_proposals.json
          node scripts/build-repricer-shadow-report.js \
            --input-dir data \
            --output-dir data
          node scripts/build-repricer-intelligence-control.js \
            --input-dir data \
            --output-dir data \
            --as-of-date '${{ steps.run_date.outputs.value }}' \
            --lookback-days 60
          node scripts/build-legacy-repricer-layer.js
          node scripts/portal-repricer-price-apply.js plan \
            --input-dir data \
            --output-dir data

      - name: Publish refreshed repricer snapshots
        env:
          ALTEA_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://iyckwryrucqrxwlowxow.supabase.co' }}
          ALTEA_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.ALTEA_SUPABASE_SERVICE_ROLE_KEY }}
          ALTEA_SNAPSHOT_SOURCE: repricer-live-prices
        run: >-
          node scripts/portal-google-sheet-upload.js
          --input-dir data
          --snapshot repricer_live_prices,repricer_live_signals,repricer_price_observation_history,repricer_market_observation_history,repricer_competitor_prices,repricer_competitor_history,repricer_calendar_factors,repricer_learning_report,repricer_decision_center,canonical_repricer,portal_repricing_reconciliation,repricer_team_policy_proposals,repricer_shadow_report,repricer_price_apply_plan,repricer
          --commit-manifest repricer_price_sync_manifest
          --bundle-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --source repricer-live-prices

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repricer-live-prices-${{ github.run_id }}
          path: |
            .portal-truth-output/repricer-live/yandex-market-prices.json
            data/repricer_live_prices.json
            data/repricer_live_signals.json
            data/repricer_price_observation_history.json
            data/repricer_market_observation_history.json
            data/repricer_competitor_prices.json
            data/repricer_competitor_history.json
            data/repricer_calendar_factors.json
            data/repricer_learning_report.json
            data/repricer_decision_center.json
            data/canonical_repricer.json
            data/portal_repricing_reconciliation.json
            data/repricer_team_policy_proposals.json
            data/repricer_shadow_report.json
            data/repricer_price_apply_plan.json
            data/repricer.json
          if-no-files-found: warn
          retention-days: 14
